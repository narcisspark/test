[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-paper-system"
version = "0.1.0"
description = "Upbit crypto paper trading and gated N2 stock paper simulation"
requires-python = ">=3.11"
dependencies = ["websockets==16.0", "nhplug==0.4.1"]

[project.scripts]
trading-paper = "trading_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trading_paper = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
